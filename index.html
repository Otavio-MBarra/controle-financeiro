<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão financeira</title>
    <link rel="stylesheet" href="css/style.min.css" />
    <script src="app/index.js" type="module" defer></script>
  </head>
  <body>
    <button id="clean-local">limpar local</button>
    <main>
      <p>Saldo do mês</p>
      <h2 class="showBalance">0,20</h2>

      <div class="recipe-month">
        <p class="recipe-month-value">0,00</p>
      </div>
      <div class="monthly-expenses">
        <p class="monthly-expenses-value">0,00</p>
      </div>
    </main>
    <form id="transaction-form">
      <label>
        <input type="radio" name="typeTransaction" value="expense" id="" />
        <span>Despesas</span>
      </label>

      <label>
        <input type="radio" name="typeTransaction" value="income" id="" />
        <span>Receita</span>
      </label>

      <label>
        Valor
        <input name="transactionValue" type="number" placeholder="0,00" />
      </label>
      <label>
        Descrição
        <input
          name="transactionDescription"
          type="text"
          placeholder="Ex: Lanche"
        />
      </label>
      <label>
        Categoria
        <input
          name="transactionCategory"
          type="text"
          list="categories"
          placeholder="Escolher categoria"
        />
        <datalist id="categories">
          <option value="Alimentação"></option>
          <option value="Transporte"></option>
          <option value="Lazer"></option>
          <option value="Saúde"></option>
          <option value="Educação"></option>
        </datalist>
      </label>
      <label>
        Data
        <input name="transactionDate" type="date" />
      </label>
      <label for="">
        Metodo de Pagamento
        <select name="transactionPayment" id="">
          <option value="Pix">Pix</option>
          x
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão de Crédito">Cartão de Crédito</option>
          <option value="Cartão de Débito">Cartão de Débito</option>
        </select>
      </label>
      <button type="submit">Adicionar</button>
    </form>

    <section class="transactionsList"></section>
  </body>
</html>
